<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/styles.css">
  <script src="src/app.js" type="module"></script>
</head>
<body>
  <main id="app">
    <h1><span class="brand-home">Home</span> <span class="brand-wallet">wallet</span></h1>

    <section id="login-view" aria-labelledby="login-heading" hidden>
      <h2 id="login-heading">Login to start</h2>
      <p id="setup-status" role="status" aria-live="polite">Preparing Google sign-in...</p>

      <div id="sign-in-actions">
        <button type="button" id="login-button" disabled>Sign in with Google</button>
        <label class="remember-label" for="remember-browser">
          <input type="checkbox" id="remember-browser">
          Remember this browser for faster sign-in
        </label>
      </div>

      <div id="unauthorized-view" hidden>
        <p id="unauthorized-account"></p>
        <p><strong>You are not authorized</strong></p>
        <button type="button" id="unauthorized-logout-button">Sign out</button>
      </div>
    </section>

    <section id="wallet-view" aria-labelledby="wallet-heading" hidden>
      <div class="wallet-heading-row">
        <h2 id="wallet-heading">Monthly wallet</h2>
        <div class="wallet-actions">
          <button type="button" id="refresh-wallet-button">Refresh</button>
          <button type="button" id="add-item-button">Add</button>
          <button type="button" id="logout-button">Sign out</button>
        </div>
      </div>

      <nav class="month-nav" aria-label="Payment month">
        <button type="button" id="month-prev-button">Previous month</button>
        <strong id="month-label" aria-live="polite"></strong>
        <button type="button" id="month-next-button">Next month</button>
      </nav>

      <section id="add-item-panel" class="add-item-panel" aria-labelledby="add-item-heading" hidden>
        <h3 id="add-item-heading">Add item</h3>
        <form id="add-item-form" autocomplete="off">
          <div class="add-grid">
            <label>Group
              <select id="add-item-group" required>
                <option value="IN">IN</option>
                <option value="Saving" disabled>Saving (coming soon)</option>
                <option value="Bills">Bills</option>
                <option value="Others">Others</option>
              </select>
            </label>
            <label>Item
              <input id="add-item-name" type="text" maxlength="120" required placeholder="Item name">
            </label>
            <label>Month
              <input id="add-item-month" type="month" required>
            </label>
            <label>Amount (RM)
              <input id="add-item-amount" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="Enter amount">
            </label>
            <label id="add-retail-field" hidden>Retail
              <input id="add-item-retail" type="text" maxlength="120">
            </label>
            <label id="add-url-field" hidden>URL (optional)
              <input id="add-item-url" type="url" maxlength="300" placeholder="https://">
            </label>
            <label id="add-remark-field">Remark (optional)
              <input id="add-item-remark" type="text" maxlength="300" placeholder="Add a note">
            </label>
          </div>
          <p id="add-item-status" class="form-status" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button type="submit" id="submit-item-button">Submit</button>
            <button type="button" id="cancel-item-button">Cancel</button>
          </div>
        </form>
      </section>

      <p id="wallet-state" class="visually-hidden" role="status" aria-live="polite"></p>

      <div class="wallet-table-wrap" id="wallet-table-wrap" hidden>
        <table class="wallet-table">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Amount (RM)</th>
              <th scope="col">Details</th>
              <th scope="col">Update</th>
            </tr>
          </thead>
          <tbody id="wallet-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
