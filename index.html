<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=green-dollar-1">
  <link rel="stylesheet" href="src/styles.css">
  <script src="src/app.js" type="module"></script>
</head>
<body>
  <main id="app">
    <h1><span class="brand-home">Home</span> <span class="brand-wallet">wallet</span></h1>

    <section id="login-view" aria-labelledby="login-heading" hidden>
      <h2 id="login-heading">Login to start</h2>
      <p id="setup-status" role="status" aria-live="polite">Preparing Google sign-in...</p>

      <div id="sign-in-actions">
        <button type="button" id="login-button" disabled>Sign in with Google</button>
        <label class="remember-label" for="remember-browser">
          <input type="checkbox" id="remember-browser">
          Remember this browser for faster sign-in
        </label>
      </div>

      <div id="unauthorized-view" hidden>
        <p id="unauthorized-account"></p>
        <p><strong>You are not authorized</strong></p>
        <button type="button" id="unauthorized-logout-button">Sign out</button>
      </div>
    </section>

    <section id="wallet-view" aria-labelledby="wallet-heading" hidden>
      <div class="wallet-heading-row">
        <h2 id="wallet-heading">Monthly wallet</h2>
        <div class="wallet-actions">
          <button type="button" id="other-months-button" aria-haspopup="dialog" aria-controls="other-months-window" aria-expanded="false">Other months</button>
          <button type="button" id="refresh-wallet-button">Refresh</button>
          <button type="button" id="add-item-button">Add</button>
          <button type="button" id="logout-button">Sign out</button>
        </div>
      </div>

      <div class="month-nav" aria-label="Current payment month">
        <strong id="month-label" aria-live="polite"></strong>
      </div>

      <div id="wallet-progress" class="operation-progress" hidden>
        <p id="wallet-progress-text" class="operation-progress-text" aria-live="polite"></p>
        <div class="progress-track" role="progressbar" aria-label="Wallet activity"><span class="progress-motion"></span></div>
      </div>

      <section id="add-item-panel" class="add-item-panel" aria-labelledby="add-item-heading" hidden>
        <h3 id="add-item-heading">Add item</h3>
        <form id="add-item-form" autocomplete="off">
          <div class="add-grid">
            <label>Group
              <select id="add-item-group" required>
                <option value="IN">IN</option>
                <option value="Saving" disabled>Saving (coming soon)</option>
                <option value="Bills">Bills</option>
                <option value="Others">Others</option>
              </select>
            </label>
            <label>Item
              <input id="add-item-name" type="text" maxlength="120" required placeholder="Item name">
            </label>
            <label>Month
              <input id="add-item-month" type="month" required>
            </label>
            <label>Amount (RM)
              <input id="add-item-amount" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="Enter amount">
            </label>
            <label id="add-retail-field" hidden>Retail
              <input id="add-item-retail" type="text" maxlength="120">
            </label>
            <label id="add-url-field" hidden>URL (optional)
              <input id="add-item-url" type="url" maxlength="300" placeholder="https://">
            </label>
            <label id="add-remark-field">Remark (optional)
              <input id="add-item-remark" type="text" maxlength="300" placeholder="Add a note">
            </label>
          </div>
          <p id="add-item-status" class="form-status" role="status" aria-live="polite"></p>
          <div id="item-progress" class="operation-progress" hidden>
            <p id="item-progress-text" class="operation-progress-text" aria-live="polite"></p>
            <div class="progress-track" role="progressbar" aria-label="Item activity"><span class="progress-motion"></span></div>
          </div>
          <div class="form-actions">
            <button type="button" id="delete-item-button" hidden>Delete</button>
            <div class="form-actions-right">
              <button type="button" id="cancel-item-button">Cancel</button>
              <button type="submit" id="submit-item-button">Submit</button>
            </div>
          </div>
        </form>
      </section>

      <p id="wallet-state" class="visually-hidden" role="status" aria-live="polite"></p>

      <div class="wallet-table-wrap" id="wallet-table-wrap" hidden>
        <table class="wallet-table">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col" class="amount-column">
                <span class="amount-heading">Amount
                  <select id="main-currency-select" class="currency-select" aria-label="Display monthly wallet amounts in">
                    <option value="MYR">RM</option>
                    <option value="KRW">₩</option>
                  </select>
                </span>
              </th>
              <th scope="col">Details</th>
              <th scope="col">Update</th>
            </tr>
          </thead>
          <tbody id="wallet-table-body"></tbody>
        </table>
      </div>
      <div id="main-exchange-info" class="exchange-info" hidden>
        <span id="main-exchange-text" aria-live="polite"></span>
        <a id="main-exchange-credit" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer" hidden>Rates by Exchange Rate API</a>
        <div id="main-exchange-progress" class="progress-track exchange-progress-track" hidden><span class="progress-motion"></span></div>
      </div>
    </section>
  </main>

  <section id="other-months-window" class="other-months-window" role="dialog" aria-modal="false" aria-labelledby="other-months-title" hidden>
    <div id="other-months-drag-handle" class="other-months-header" role="group" aria-label="Move the window using arrow keys" tabindex="0">
      <div class="other-months-heading">
        <h2 id="other-months-title">Other months</h2>
        <span class="drag-hint">Drag to move</span>
      </div>
      <button type="button" id="other-months-close" class="other-months-close" aria-label="Close other months">×</button>
    </div>
    <div class="other-months-scroll">
      <nav class="other-months-nav" aria-label="Browse other months">
        <button type="button" id="other-months-prev" aria-label="Previous month">Previous</button>
        <strong id="other-months-label" aria-live="polite"></strong>
        <button type="button" id="other-months-next" aria-label="Next month">Next</button>
      </nav>
      <div class="wallet-table-wrap other-months-table-wrap">
        <table class="wallet-table other-months-table">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col" class="amount-column">
                <span class="amount-heading">Amount
                  <select id="other-currency-select" class="currency-select" aria-label="Display other months amounts in">
                    <option value="MYR">RM</option>
                    <option value="KRW">₩</option>
                  </select>
                </span>
              </th>
              <th scope="col">Details</th>
              <th scope="col">Update</th>
            </tr>
          </thead>
          <tbody id="other-months-table-body"></tbody>
        </table>
      </div>
      <div id="other-exchange-info" class="exchange-info" hidden>
        <span id="other-exchange-text" aria-live="polite"></span>
        <a id="other-exchange-credit" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer" hidden>Rates by Exchange Rate API</a>
        <div id="other-exchange-progress" class="progress-track exchange-progress-track" hidden><span class="progress-motion"></span></div>
      </div>
    </div>
    <button type="button" id="other-months-resize-handle" class="other-months-resize-handle"
      aria-label="Resize other months window" title="Drag to resize; arrow keys also work"></button>
  </section>
</body>
</html>
